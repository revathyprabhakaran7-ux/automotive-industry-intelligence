
name: Test Automotive AI Assistant

on:
  push:
    paths:
      - "03-ai-analytics-assistant/**"
      - ".github/workflows/test-ai-assistant.yml"
  pull_request:
    paths:
      - "03-ai-analytics-assistant/**"
      - ".github/workflows/test-ai-assistant.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 03-ai-analytics-assistant/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile 03-ai-analytics-assistant/src/mcp_server.py

      - name: Run unit tests
        run: |
          python -m pytest 03-ai-analytics-assistant/tests/ -v
