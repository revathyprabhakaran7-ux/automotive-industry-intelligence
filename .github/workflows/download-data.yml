name: Download Automotive Data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Statistics Canada dataset
        run: python 01-business-intelligence/src/load_data.py

      - name: Upload downloaded files
        uses: actions/upload-artifact@v4
        with:
          name: automotive-sales-data
          path: 01-business-intelligence/data/
          retention-days: 7
