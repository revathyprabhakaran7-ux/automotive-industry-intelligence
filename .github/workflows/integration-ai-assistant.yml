name: Automotive AI Integration

on:
  workflow_dispatch:
  push:
    paths:
      - "03-ai-analytics-assistant/**"
      - ".github/workflows/integration-ai-assistant.yml"

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install required libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 02-automotive-forecasting/requirements.txt
          python -m pip install -r 03-ai-analytics-assistant/requirements.txt
          python -m pip install requests

      # Step 4: Download real Statistics Canada data
      - name: Download Statistics Canada data
        run: |
          python 01-business-intelligence/src/load_data.py

      # Step 5: Clean and prepare monthly vehicle sales
      - name: Prepare monthly sales
        run: |
          python 01-business-intelligence/src/prepare_data.py

      # Step 6: Train, evaluate and forecast vehicle sales
      - name: Generate sales forecasts
        run: |
          python 02-automotive-forecasting/src/forecast_sales.py

      # Step 7: Validate real data and analytical functions
      - name: Validate MCP tools with real data
        run: |
          python 03-ai-analytics-assistant/src/integration_report.py

      # Step 8: Test MCP client-server communication
      - name: Test real MCP client-server communication
        run: |
          python 03-ai-analytics-assistant/src/mcp_client_test.py

      # Step 9: Upload evaluation and MCP test results
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automotive-ai-integration-results
          path: |
            03-ai-analytics-assistant/outputs/integration_report.json
            03-ai-analytics-assistant/outputs/mcp_protocol_results.json
            02-automotive-forecasting/outputs/metrics.json
            02-automotive-forecasting/outputs/next_12_months_forecast.csv
          if-no-files-found: error
          retention-days: 30
