
name: Deploy Automotive Intelligence Assistant

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "03-ai-analytics-assistant/**"
      - ".github/workflows/deploy-automotive-assistant.yml"

permissions:
  contents: read

concurrency:
  group: automotive-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 02-automotive-forecasting/requirements.txt
          python -m pip install -r 03-ai-analytics-assistant/requirements.txt
          python -m pip install requests

      - name: Download Statistics Canada data
        run: |
          python 01-business-intelligence/src/load_data.py

      - name: Prepare monthly sales
        run: |
          python 01-business-intelligence/src/prepare_data.py

      - name: Generate forecasting outputs
        run: |
          python 02-automotive-forecasting/src/forecast_sales.py

      - name: Run unit tests
        run: |
          python -m pytest 03-ai-analytics-assistant/tests -v

      - name: Validate real data integration
        run: |
          python 03-ai-analytics-assistant/src/integration_report.py

      - name: Verify MCP client-server communication
        run: |
          python 03-ai-analytics-assistant/src/mcp_client_test.py

      - name: Prepare website dataset
        run: |
          python -c "import json,pathlib; p=pathlib.Path('03-ai-analytics-assistant'); d=json.loads((p/'outputs/integration_report.json').read_text()); assert d['integration_status']=='passed'; assert len(d['results']['forecast'])==12; (p/'web/data.json').write_text(json.dumps(d,indent=2))"

      - name: Validate website files
        run: |
          test -s 03-ai-analytics-assistant/web/index.html
          test -s 03-ai-analytics-assistant/web/data.json
          python -m json.tool 03-ai-analytics-assistant/web/data.json > /dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 03-ai-analytics-assistant/web

      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: automotive-assistant-validation
          path: |
            03-ai-analytics-assistant/outputs/integration_report.json
            03-ai-analytics-assistant/outputs/mcp_protocol_results.json
            02-automotive-forecasting/outputs/metrics.json
          retention-days: 30

  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
